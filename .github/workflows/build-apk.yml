name: Build and Download APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de Build (debug ou release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Preparar Arquivos de Configuração (.env e Keystore)
        run: |
          # Cria arquivo .env se não existir
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          # Configura o debug.keystore
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Permissões de Execução do Gradle Wrapper
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper
          fi
          chmod +x ./gradlew

      - name: Compilar APK Android
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          if [ -z "$BUILD_TYPE" ]; then
            BUILD_TYPE="debug"
          fi

          echo "Iniciando compilação do APK no modo: $BUILD_TYPE"

          if [ "$BUILD_TYPE" = "release" ]; then
            if [ -f "my-upload-key.jks" ] && [ -n "${{ secrets.STORE_PASSWORD }}" ]; then
              echo "Compilando Release assinado..."
              ./gradlew assembleRelease --stacktrace
            else
              echo "Keystore de release não configurado. Compilando APK Debug (pronto para instalar)..."
              ./gradlew assembleDebug --stacktrace
            fi
          else
            echo "Compilando APK Debug..."
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Renomear e Organizar APK
        run: |
          mkdir -p build-apks

          if [ -d "app/build/outputs/apk" ]; then
            echo "Localizando APKs em app/build/outputs/apk..."
            find app/build/outputs/apk -name "*.apk" -exec cp {} build-apks/ \;
          else
            echo "Diretório padrão de outputs não encontrado. Varrendo app/build..."
            find app/build -name "*.apk" -exec cp {} build-apks/ \; 2>/dev/null || true
          fi

          APK_COUNT=$(find build-apks/ -maxdepth 1 -name "*.apk" | wc -l)
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERRO: Nenhum arquivo APK foi encontrado após a compilação!"
            exit 1
          fi

          echo "APKs prontos para download ($APK_COUNT encontrado(s)):"
          ls -lh build-apks/

      - name: Disponibilizar APK para Download (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: app-estoque-apk
          path: build-apks/*.apk
          retention-days: 30

      - name: Criar Release no GitHub (para Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-apks/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
